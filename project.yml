name: BookWriter

options:
  bundleIdPrefix: com.kira
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptySchemes: true

targets:
  BookWriter:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.kira.bookwriter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "5.9"
