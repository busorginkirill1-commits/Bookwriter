name: Build BookWriter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project BookWriter.xcodeproj \
            -scheme BookWriter \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r $(find ~/Library/Developer/Xcode/DerivedData -name "BookWriter.app" -path "*/Release-iphoneos/*" | head -1) Payload/
          zip -r BookWriter.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BookWriter
          path: BookWriter.ipa
