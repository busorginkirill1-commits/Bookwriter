name: Build BookWriter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project BookWriter.xcodeproj \
            -scheme BookWriter \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        run: |
          APP_PATH=$(find build -name "BookWriter.app" -path "*/Release-iphoneos/*" | head -1)
          mkdir -p ipa/Payload
          cp -r "$APP_PATH" ipa/Payload/
          cd ipa
          zip -r BookWriter.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BookWriter
          path: ipa/BookWriter.ipa
